name: Build on Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build extension packages
        run: deno task build

      - name: Upload packages to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine the tag name, default to the latest git tag if manual run
          TAG_NAME="${{ github.event.release.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          fi

          # Create and rename output files
          CHROME_FILE="pvzge-sync-chrome-${TAG_NAME}.zip"
          FIREFOX_FILE="pvzge-sync-firefox-${TAG_NAME}.zip"

          cp dist/chrome.zip "$CHROME_FILE"
          cp dist/firefox.zip "$FIREFOX_FILE"

          echo "Uploading $CHROME_FILE and $FIREFOX_FILE to release $TAG_NAME..."
          gh release upload "$TAG_NAME" "$CHROME_FILE" "$FIREFOX_FILE" --clobber
